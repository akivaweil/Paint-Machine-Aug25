
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    thomasfredericks/Bounce2 @ ^2.71
    gin66/FastAccelStepper @ ^0.31.0
    
monitor_speed = 115200
upload_protocol = esptoo
upload_port = /dev/cu.usbmodem*
upload_speed = 921600


